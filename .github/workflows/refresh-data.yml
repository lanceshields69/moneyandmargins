name: Refresh FEC data

# Every 3 hours through Nov 4 (UTC), then daily through Nov 10. GitHub cron cannot express a date range,
# so both schedules are registered and the gate step lets only the right one run on a given day.
on:
  schedule:
    - cron: '7 0,3,6,9,12,15,18,21 * 10,11 *'
    - cron: '17 12 * 11 *'
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INCOMPLETE_CHECK: warn
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Gate by date
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run=false
          if [ "$EVENT" = "workflow_dispatch" ]; then run=true
          elif [ "$SCHEDULE" = "7 0,3,6,9,12,15,18,21 * 10,11 *" ] && [[ "$now" < "2026-11-05T00:00:00Z" ]]; then run=true
          elif [ "$SCHEDULE" = "17 12 * 11 *" ] && [[ "$now" > "2026-11-05T00:00:00Z" ]] && [[ "$now" < "2026-11-11T00:00:00Z" ]]; then run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Gate: $EVENT $SCHEDULE at $now -> run=$run"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      # Paces itself under the FEC's 1,000 requests per hour and retries politely. Writes a candidate file, never
      # spending.json: scripts/verify.ts must pass first. It also exits non-zero, before writing anything, on any
      # failure or when the pull has far fewer rows than the last one.
      - name: Fetch spending
        id: fetch
        if: steps.gate.outputs.run == 'true'
        run: npx tsx scripts/fetch-spending.ts --confirm --out=data/spending.candidate.json

      - name: Save the raw pull
        if: steps.gate.outputs.run == 'true' && steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-pull-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/
          retention-days: 90

      # Blocking checks (race totals did not drop; Texas PAC and SLF PAC match the saved FEC exports) stop the run
      # here. The result is appended to data/verification.json either way. No flag is ever changed automatically.
      - name: Verify
        id: verify
        if: steps.gate.outputs.run == 'true' && steps.fetch.outcome == 'success'
        run: npx tsx scripts/verify.ts --candidate=data/spending.candidate.json --previous=data/spending.json

      - name: Replace spending.json
        if: steps.verify.outcome == 'success'
        run: mv data/spending.candidate.json data/spending.json

      # Compares VotePredictor with the latest frozen snapshot and writes the table to the run summary. When a rating
      # label changes or a probability moves a point or more, it freezes a new snapshot; the commit step saves it.
      - name: Check forecasts and freeze on change
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: npx tsx scripts/check-forecast.ts --freeze-if-changed | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run tests and data checks
        if: steps.verify.outcome == 'success'
        run: |
          npm test
          npm run check:incomplete 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification.json data/frozen
          if [ "${{ steps.verify.outcome }}" = "success" ]; then git add data/spending.json; fi
          git diff --cached --quiet || git commit -m "Refresh FEC spending data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # main deploys to production. Any other branch deploys a Preview, which gets the Preview environment variables.
      - name: Deploy to Vercel
        if: steps.verify.outcome == 'success'
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then env=production; flag=--prod; else env=preview; flag=; fi
          npx vercel@latest pull --yes --environment=$env --token="$VERCEL_TOKEN"
          npx vercel@latest build $flag --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt $flag --token="$VERCEL_TOKEN" | tee deploy-url.txt
          echo "Deployed: $(tail -1 deploy-url.txt)" >> "$GITHUB_STEP_SUMMARY"

      # A failed run leaves spending.json as it was and says so: the run goes red and an issue is opened
      # (or commented on, if one is already open).
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Data refresh failed"
          body="The scheduled FEC refresh failed, so data/spending.json was not changed. Run: $RUN_URL"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
